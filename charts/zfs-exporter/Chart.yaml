---
apiVersion: v2
name: zfs-exporter
description: Prometheus exporter for per-dataset and per-pool OpenZFS metrics
type: application

# A placeholder. The real version is the git tag. release.yml passes that tag
# to `helm package --version`, which stamps it into the packaged chart. You
# never change this value, and the chart can never name a version that the
# release did not build.
#
# The default of the chart's image.tag is this version, and not the appVersion
# below. In a packaged chart that is the tag. In a git checkout it is the
# placeholder.
version: 0.0.0-dev

# The zfs_exporter release inside the image. Informational: several packaging
# releases can share one appVersion, which is why it does not name the image
# tag. hack/update-upstream.sh moves this with the Dockerfile pin.
appVersion: "2.4.1"

home: https://github.com/tschuering/zfs-exporter-helm
sources:
  - https://github.com/tschuering/zfs-exporter-helm
  - https://github.com/pdf/zfs_exporter
keywords:
  - zfs
  - openzfs
  - prometheus
  - monitoring
  - exporter

# The exporter runs zpool(8)/zfs(8) against the node's kernel module, so it
# only makes sense on nodes that have one. Nothing here needs a recent API.
kubeVersion: ">=1.19.0-0"

maintainers:
  - name: Tobias Schüring
    email: tobias@schuering.xyz

annotations:
  artifacthub.io/license: MIT
  artifacthub.io/operator: "false"
