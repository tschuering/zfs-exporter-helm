{{- if .Values.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zfs-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zfs-exporter.labels" . | nindent 4 }}
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  # A DaemonSet reports different metrics on each node, so a client must
  # address each pod separately and not through a load balancer. A ClusterIP
  # that selected one pod per scrape would report a different node's pools each
  # time. Endpoint discovery (ServiceMonitor, or Alloy role=endpoints) reads
  # every address.
  clusterIP: {{ if eq .Values.service.type "ClusterIP" }}None{{ else }}""{{ end }}
  selector:
    {{- include "zfs-exporter.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.service.port }}
      targetPort: metrics
      protocol: TCP
{{- end }}
