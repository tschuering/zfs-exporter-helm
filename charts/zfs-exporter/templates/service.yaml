{{- if .Values.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zfs-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zfs-exporter.labels" . | nindent 4 }}
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # Headless, and not a value. A DaemonSet reports different metrics on each
  # node, so a client must address each pod separately. A load-balanced address
  # would report a different node's pools on each scrape. Endpoint discovery
  # (ServiceMonitor, or Alloy role=endpoints) reads every address.
  type: ClusterIP
  clusterIP: None
  # The component label is required here. Without it this selector also matches
  # the device-plugin pods.
  selector:
    {{- include "zfs-exporter.exporterSelectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      # A headless Service translates no port, so this is listenPort and it
      # cannot be an independent value.
      port: {{ .Values.listenPort }}
      targetPort: metrics
      protocol: TCP
{{- end }}
