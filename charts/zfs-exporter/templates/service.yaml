{{- if .Values.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zfs-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zfs-exporter.labels" . | nindent 4 }}
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  # A DaemonSet's metrics differ per node, so the pods must be addressable
  # individually rather than load-balanced across: a ClusterIP that picked one
  # pod per scrape would report a different node's pools each time. Endpoint
  # discovery (ServiceMonitor, Alloy's role=endpoints) reads every address.
  clusterIP: {{ if eq .Values.service.type "ClusterIP" }}None{{ else }}""{{ end }}
  selector:
    {{- include "zfs-exporter.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.service.port }}
      targetPort: metrics
      protocol: TCP
{{- end }}
