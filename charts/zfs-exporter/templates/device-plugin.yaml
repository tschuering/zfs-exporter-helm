---
# This DaemonSet advertises the node's /dev/zfs to the kubelet. The kubelet can
# then give the device to the exporter, and the exporter does not run
# privileged.
#
# The plugin must be its own DaemonSet, and not a container next to the
# exporter. The kubelet admits a pod only after the resource that the pod
# requests is registered, so a plugin in that same pod could never start. The
# pod would wait for itself.
#
# The plugin is privileged, because the kubelet's plugin directory requires it.
# Kubernetes documents that requirement, so it is not a choice made here. The
# plugin has no network listener. It communicates only with the kubelet over a
# Unix socket, and it never opens the device that it supplies.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "zfs-exporter.fullname" . }}-device-plugin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zfs-exporter.labels" . | nindent 4 }}
    app.kubernetes.io/component: device-plugin
spec:
  selector:
    matchLabels:
      {{- include "zfs-exporter.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: device-plugin
  updateStrategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "zfs-exporter.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: device-plugin
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.devicePlugin.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.devicePlugin.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      # The plugin runs on every node. It reports zero devices where there is
      # no ZFS, which keeps the exporter off those nodes with no nodeSelector.
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      hostNetwork: false
      containers:
        - name: device-plugin
          image: {{ include "zfs-exporter.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/local/bin/zfs-device-plugin
          env:
            - name: RESOURCE_NAME
              value: {{ .Values.devicePlugin.resourceName | quote }}
            - name: DEVICE_PATH
              value: {{ .Values.devicePlugin.devicePath | quote }}
            - name: PLUGIN_DIR
              value: {{ .Values.devicePlugin.kubeletPluginDir | quote }}
            - name: DEVICE_COUNT
              value: {{ .Values.devicePlugin.count | quote }}
          resources:
            {{- toYaml .Values.devicePlugin.resources | nindent 12 }}
          securityContext:
            # This is not a preference. Kubernetes documents that the
            # kubelet's plugin directory requires a privileged security
            # context. privileged is all or nothing: it grants every capability
            # and disables seccomp, whatever else this block sets. A capability
            # list or a seccomp profile here would read as a restriction and do
            # nothing, so this block sets neither.
            privileged: true
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: kubelet-plugins
              mountPath: {{ .Values.devicePlugin.kubeletPluginDir }}
            # The plugin only calls stat() on this path, to decide whether to
            # advertise a device.
            - name: dev-zfs
              mountPath: {{ .Values.devicePlugin.devicePath }}
              readOnly: true
      volumes:
        - name: kubelet-plugins
          hostPath:
            path: {{ .Values.devicePlugin.kubeletPluginDir }}
            type: Directory
        - name: dev-zfs
          hostPath:
            path: {{ .Values.devicePlugin.devicePath }}
            type: CharDevice
