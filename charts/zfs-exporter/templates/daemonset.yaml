{{- include "zfs-exporter.validateValues" . }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "zfs-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zfs-exporter.labels" . | nindent 4 }}
    app.kubernetes.io/component: exporter
spec:
  # These two labels match the device-plugin pods as well. spec.selector is
  # immutable, so it cannot gain the component label that separates them. The
  # pod template below carries that label, and the Service and the
  # NetworkPolicy select on it.
  selector:
    matchLabels:
      {{- include "zfs-exporter.selectorLabels" . | nindent 6 }}
  updateStrategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "zfs-exporter.exporterSelectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if .Values.prometheusAnnotations.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.listenPort | quote }}
        prometheus.io/path: /metrics
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # No serviceAccountName. Every pod gets a service account, and with this
      # field unset the admission controller writes "default". The token is
      # what grants API access, and this pod projects none. An exporter that
      # reads the node's ZFS state needs no Kubernetes credential.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      # Not values. The exporter reads the node's ZFS state through /dev/zfs,
      # and it opens no outbound connection. It needs no host namespace, and
      # hostNetwork: true would also put the metrics port on the node address,
      # where most CNIs stop applying the NetworkPolicy.
      hostNetwork: false
      hostPID: false
      hostIPC: false
      # runAsNonRoot follows runAsUser, so the two can never contradict each
      # other. A values file merges into the defaults rather than replacing
      # them, so a free-form block here would leave runAsNonRoot: true beside
      # runAsUser: 0, and the kubelet would refuse the pod.
      #
      # The seccomp profile is not a value. Nothing here needs it removed.
      securityContext:
        runAsUser: {{ .Values.runAsUser }}
        runAsGroup: {{ .Values.runAsGroup }}
        runAsNonRoot: {{ ne (int .Values.runAsUser) 0 }}
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: zfs-exporter
          image: {{ include "zfs-exporter.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --web.listen-address=:{{ .Values.listenPort }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.zfsUserlandVersion .Values.extraEnv }}
          env:
            {{- if .Values.zfsUserlandVersion }}
            - name: ZFS_USERLAND_VERSION
              value: {{ .Values.zfsUserlandVersion | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.listenPort }}
              protocol: TCP
          # The two probes have the same parameters, and each one does a
          # different job. The liveness probe restarts a listener that stopped
          # answering. The readiness probe gates the rollout: the DaemonSet
          # controller counts a pod that is not ready against maxUnavailable,
          # so a broken image stops after one node.
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # requests and limits are rendered separately, so that the device
          # can merge into limits. An extended resource must be a limit, and
          # toYaml of the whole block would render `limits` a second time.
          #
          # The request also keeps this pod off nodes without ZFS. The plugin
          # advertises the resource only where the device exists, so the
          # scheduler places the pod nowhere else.
          resources:
            {{- with .Values.resources.requests }}
            requests:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            limits:
              {{- with .Values.resources.limits }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
              {{ .Values.devicePlugin.resourceName }}: 1
          # Not values. Every other setting of these four fields weakens the
          # pod, and none of them has a use: the exporter reads pool and
          # dataset properties and writes nothing. privileged: true would also
          # discard the seccomp profile above.
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
