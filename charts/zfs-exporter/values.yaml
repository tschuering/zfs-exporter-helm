---
# Default values for zfs-exporter.

image:
  registry: ghcr.io
  repository: tschuering/zfs-exporter
  # The default is the chart version, not appVersion. One release tag builds
  # the image and the chart, and both carry the same version. appVersion names
  # the exporter in the image, and several releases can share one appVersion.
  # In a git checkout the chart version is a placeholder, so a local render
  # names an image tag that does not exist.
  #
  # Set `digest` instead for a reproducible pin. If both are set, the digest
  # applies and the tag is ignored.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
commonLabels: {}

# The exporter has its own service account, although it never calls the API.
# Every pod runs as some service account. An empty setting selects "default",
# not "none". CIS Kubernetes 5.1.5 states that default service accounts should
# not be actively used. This account exists to satisfy that check, and it holds
# no permission. The chart grants no RBAC at all.
#
# Set create: false to run under the namespace's default account instead. The
# token stays disabled in both cases.
serviceAccount:
  create: true
  name: ""
  annotations: {}

# This is set on the pod, and the pod setting decides whether Kubernetes
# projects a token. The same field on a ServiceAccount is only a default, and
# the pod setting overrides it. There is deliberately one setting and not two:
# an exporter that reads the node's ZFS state needs no Kubernetes credential.
automountServiceAccountToken: false

# ---------------------------------------------------------------------------
# Scheduling
#
# The chart sets no nodeSelector. On a cluster where only some nodes have ZFS,
# constrain the DaemonSet explicitly, for example:
#   nodeSelector:
#     feature.node.kubernetes.io/storage-zfs: "true"
# On a node without the ZFS module, the pod stays Running and every scrape
# reports zfs_scrape_collector_success 0. That raises an alert instead of a
# crash loop.
# ---------------------------------------------------------------------------
nodeSelector: {}
affinity: {}

# Keep node-level telemetry on nodes that are cordoned, tainted or under
# pressure. Those are the nodes whose pool metrics matter most.
tolerations:
  - operator: Exists

priorityClassName: ""

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

# ---------------------------------------------------------------------------
# Security
#
# Root is required, not incidental. /dev/zfs is mode 0600 root:root, so the
# ioctls behind `zpool list` need DAC ownership. That is the only privilege the
# pod holds. The chart drops every capability, mounts a read-only rootfs,
# disables privilege escalation, and shares no host namespace. The exporter
# reads pool and dataset properties. It never mounts, creates or destroys
# anything.
# ---------------------------------------------------------------------------
podSecurityContext:
  runAsUser: 0
  runAsGroup: 0
  seccompProfile:
    type: RuntimeDefault

# These settings have an effect because the exporter is not privileged. The
# device comes from the device plugin instead, which is the reason this chart
# carries one. `privileged: true` would silently discard the capability drop
# and the seccomp profile above. Both effects are measured, not assumed.
#
# With no capabilities, OpenZFS permits the exporter's reads and the kernel
# refuses every other operation. zfs_secpolicy_read requires no privilege.
# Every mutating ioctl goes through secpolicy_sys_config or secpolicy_zfs,
# which are CAP_SYS_ADMIN or EPERM.
securityContext:
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

hostNetwork: false
hostPID: false
dnsPolicy: ClusterFirst

# ---------------------------------------------------------------------------
# Device plugin
#
# A container can open only a device that the device cgroup permits, and
# Kubernetes does not add hostPath devices to that allowlist. Two solutions
# exist. The first is `privileged: true`, which grants every capability and
# disables seccomp. The second is a device plugin, which lets the kubelet
# insert the device into an otherwise unprivileged container. This chart uses
# the second solution.
#
# The plugin must be a separate DaemonSet. The kubelet admits a pod only after
# the resource that the pod requests exists, so a plugin in the exporter's own
# pod could never start.
# ---------------------------------------------------------------------------
devicePlugin:
  # The advertised resource. By convention the prefix is a vendor domain. This
  # prefix is the host that serves this chart's own Helm repository, so it is a
  # domain that the project controls, and not a name that someone else might
  # own. It is distinct enough that it cannot collide with another plugin that
  # advertises devices on the same node.
  resourceName: tschuering.github.io/dev-zfs

  devicePath: /dev/zfs

  # The directory where the kubelet expects plugin sockets. The kubelet
  # hardcodes this path, but the root moves on some distributions.
  kubeletPluginDir: /var/lib/kubelet/device-plugins

  # The number of pods that can hold the device at the same time. One
  # DaemonSet pod per node needs exactly one. Raise the value if something else
  # requests the resource.
  count: 1

  # Empty by default. system-node-critical is the usual choice for a node
  # component, but some clusters restrict those classes to kube-system.
  priorityClassName: ""

  podAnnotations: {}

  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi

# The image carries an OpenZFS userland for each supported branch. At run time
# it selects the userland that matches the node, and it reads
# /sys/module/zfs/version to do so. That file needs no mount, because module
# state is not namespaced. One DaemonSet therefore serves nodes on different
# branches, and an upgrade of a node from one branch to the other needs no
# change here.
#
# Set this value only to replace that detection, for example "2.4" to force a
# branch on a node where /sys is not at the path the shim expects. A wrong
# value produces a clear startup error that names the branches the image
# carries.
zfsUserlandVersion: ""

# ---------------------------------------------------------------------------
# Exporter
# ---------------------------------------------------------------------------
listenPort: 9134

# Flags added to the container command, for example:
#   extraArgs:
#     - --collector.dataset-snapshot
#     - --pool=rpool
extraArgs: []

extraEnv: []
extraVolumes: []
extraVolumeMounts: []

# These values are small by design. The work is to fork zpool and zfs, and to
# parse their output. The limit stops an extreme `zfs get` on a pool with very
# many datasets from competing with the workloads that the exporter measures.
resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 128Mi

# "/" is the exporter-toolkit landing page. It is the only endpoint outside
# /metrics that answers. This exporter has no /-/healthy endpoint.
livenessProbe:
  httpGet:
    path: /
    port: metrics
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /
    port: metrics
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 5

terminationGracePeriodSeconds: 30

podAnnotations: {}
podLabels: {}

# ---------------------------------------------------------------------------
# Service and scraping
# ---------------------------------------------------------------------------
service:
  enabled: true
  type: ClusterIP
  port: 9134
  annotations: {}
  labels: {}

# For the Prometheus Operator. Disabled by default, because the CRD can be
# absent. Helm would then fail the install instead of skipping the object.
serviceMonitor:
  enabled: false
  # Defaults to the release namespace.
  namespace: ""
  interval: 60s
  scrapeTimeout: 30s
  labels: {}
  annotations: {}
  relabelings: []
  metricRelabelings: []
  # A DaemonSet reports metrics per node, so copy the node name onto them.
  honorLabels: false

# An alternative to a ServiceMonitor, for agents that discover by annotation
# (Alloy, and the Prometheus kubernetes_sd annotation convention).
prometheusAnnotations:
  enabled: false

# Disabled by default. A NetworkPolicy has an effect only if the cluster's CNI
# enforces policies. A policy with no effect is worse than no policy, because a
# reader sees it as protection. On a cluster that does enforce policies, a
# policy that names the wrong source stops your scraper from reaching this
# exporter.
networkPolicy:
  enabled: false
  # Selectors for whatever scrapes this exporter, for example the Prometheus
  # or Alloy pod. An empty list renders a policy that permits the metrics port
  # from anywhere and denies every other port. That limits the ports, not the
  # clients.
  ingressFrom: []
