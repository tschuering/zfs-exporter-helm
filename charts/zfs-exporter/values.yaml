---
# Default values for zfs-exporter.

image:
  registry: ghcr.io
  repository: tschuering/zfs-exporter
  # The default is the chart version, not appVersion. One release tag builds
  # the image and the chart, and both carry the same version. appVersion names
  # the exporter in the image, and several releases can share one appVersion.
  # In a git checkout the chart version is a placeholder, so a local render
  # names an image tag that does not exist.
  #
  # Set `digest` instead for a reproducible pin. If both are set, the digest
  # applies and the tag is ignored.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
commonLabels: {}

# There is no serviceAccount block, and no automountServiceAccountToken key.
# Neither pod calls the Kubernetes API, so neither needs an identity. Both pods
# pin automountServiceAccountToken: false, and that setting is what removes the
# projected token. Without a token a pod cannot authenticate at all.
#
# A chart cannot give a pod no service account. With the field unset, the
# admission controller writes "default", so both pods run as that account with
# no token. A dedicated account would add a name and nothing else, because the
# chart grants no RBAC.

# ---------------------------------------------------------------------------
# Scheduling
#
# The chart sets no nodeSelector. On a cluster where only some nodes have ZFS,
# constrain the DaemonSet explicitly, for example:
#   nodeSelector:
#     feature.node.kubernetes.io/storage-zfs: "true"
# On a node without the ZFS module, the pod stays Running and every scrape
# reports zfs_scrape_collector_success 0. That raises an alert instead of a
# crash loop.
# ---------------------------------------------------------------------------
nodeSelector: {}
affinity: {}

# Keep node-level telemetry on nodes that are cordoned, tainted or under
# pressure. Those are the nodes whose pool metrics matter most.
tolerations:
  - operator: Exists

priorityClassName: ""

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

# ---------------------------------------------------------------------------
# Security
#
# The exporter runs as a non-root uid with no capability at all. Two separate
# rules control a device node, and neither one needs root:
#
#   1. The device cgroup decides whether the container can open the node. The
#      device plugin is what puts /dev/zfs on that list. This rule ignores the
#      uid.
#   2. The file permissions decide which uid can open it. OpenZFS ships
#      90-zfs.rules, which sets /dev/zfs to mode 0666, so every uid passes.
#
# OpenZFS then checks each ioctl itself. zfs_secpolicy_read requires no
# privilege, and every mutating ioctl requires CAP_SYS_ADMIN, which this pod
# does not hold. Measured on a node: uid 65532, CapEff 0000000000000000, all
# three collectors report success.
#
# These two keys are the whole security surface of this chart. The rest is not
# configurable, because no other value has a use: runAsNonRoot follows the uid
# below, the seccomp profile stays RuntimeDefault, and the container drops
# every capability with a read-only root filesystem.
#
# 65532 is the uid that distroless calls "nonroot". With it, this pod meets the
# restricted Pod Security Standard.
#
# ONE HOST NEEDS A CHANGE HERE. The udev rule above carries
# OPTIONS+="static_node=zfs". On a host where udev never ran, the kernel
# creates /dev/zfs at mode 0600 root:root and nothing relaxes it. The exporter
# then stops at open() with "permission denied". Set both keys to 0 on such a
# host, and runAsNonRoot follows. Run `ls -l /dev/zfs` on the node to see which
# case applies.
runAsUser: 65532
runAsGroup: 65532

# ---------------------------------------------------------------------------
# Device plugin
#
# A container can open only a device that the device cgroup permits, and
# Kubernetes does not add hostPath devices to that allowlist. Two solutions
# exist. The first is `privileged: true`, which grants every capability and
# disables seccomp. The second is a device plugin, which lets the kubelet
# insert the device into an otherwise unprivileged container. This chart uses
# the second solution.
#
# The plugin must be a separate DaemonSet. The kubelet admits a pod only after
# the resource that the pod requests exists, so a plugin in the exporter's own
# pod could never start.
# ---------------------------------------------------------------------------
devicePlugin:
  # The advertised resource. By convention the prefix is a vendor domain. This
  # prefix is the host that serves this chart's own Helm repository, so it is a
  # domain that the project controls, and not a name that someone else might
  # own. It is distinct enough that it cannot collide with another plugin that
  # advertises devices on the same node.
  resourceName: tschuering.github.io/dev-zfs

  # The directory where the kubelet expects plugin sockets. The kubelet
  # hardcodes this path, but the root moves on some distributions.
  kubeletPluginDir: /var/lib/kubelet/device-plugins

  # Empty by default. system-node-critical is the usual choice for a node
  # component, but some clusters restrict those classes to kube-system.
  priorityClassName: ""

  # The plugin has its own strategy, its own labels and its own annotations.
  # The exporter and the plugin are separate workloads, and a rollout of one
  # is not a rollout of the other.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

  podLabels: {}
  podAnnotations: {}

  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi

# The image carries an OpenZFS userland for each supported branch. At run time
# it selects the userland that matches the node, and it reads
# /sys/module/zfs/version to do so. That file needs no mount, because module
# state is not namespaced. One DaemonSet therefore serves nodes on different
# branches, and an upgrade of a node from one branch to the other needs no
# change here.
#
# Set this value only to replace that detection, for example "2.4" to force a
# branch on a node where /sys is not at the path the shim expects. A wrong
# value produces a clear startup error that names the branches the image
# carries.
zfsUserlandVersion: ""

# ---------------------------------------------------------------------------
# Exporter
# ---------------------------------------------------------------------------
listenPort: 9134

# Flags added to the container command, for example:
#   extraArgs:
#     - --collector.dataset-snapshot
#     - --pool=rpool
extraArgs: []

extraEnv: []
extraVolumes: []
extraVolumeMounts: []

# These values are small by design. The work is to fork zpool and zfs, and to
# parse their output. The limit stops an extreme `zfs get` on a pool with very
# many datasets from competing with the workloads that the exporter measures.
resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 128Mi

# "/" is the exporter-toolkit landing page. It is the only endpoint outside
# /metrics that answers. This exporter has no /-/healthy endpoint.
livenessProbe:
  httpGet:
    path: /
    port: metrics
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /
    port: metrics
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 5

podAnnotations: {}
podLabels: {}

# ---------------------------------------------------------------------------
# Service and scraping
# ---------------------------------------------------------------------------
# The Service is headless, and its port is listenPort. Neither is a value. A
# DaemonSet reports different metrics on each node, so a load-balanced address
# would report a different node's pools on each scrape. A headless Service
# translates no port, so a separate Service port could only be wrong.
#
# Set enabled: false if nothing discovers by endpoint, for example with
# prometheusAnnotations and an agent that reads pod annotations.
service:
  enabled: true
  annotations: {}
  labels: {}

# For the Prometheus Operator. Disabled by default, because the CRD can be
# absent. Helm would then fail the install instead of skipping the object.
serviceMonitor:
  enabled: false
  # Defaults to the release namespace.
  namespace: ""
  interval: 60s
  scrapeTimeout: 30s
  labels: {}
  annotations: {}
  # These are added to the relabeling that the template always applies, which
  # copies the pod's node name onto the metrics. A DaemonSet reports per-node
  # metrics, and they are useful only if a reader can separate the nodes.
  relabelings: []
  metricRelabelings: []
  # Keep the server's labels when a scraped label has the same name. The
  # exporter sets no label that collides, so this stays false.
  honorLabels: false

# An alternative to a ServiceMonitor, for agents that discover by annotation
# (Alloy, and the Prometheus kubernetes_sd annotation convention).
prometheusAnnotations:
  enabled: false

# Disabled by default. A NetworkPolicy has an effect only if the cluster's CNI
# enforces policies. A policy with no effect is worse than no policy, because a
# reader sees it as protection. On a cluster that does enforce policies, a
# policy that names the wrong source stops your scraper from reaching this
# exporter.
#
# The policy also denies every outbound connection, and that part has no
# value. The exporter opens no connection of its own, so an egress rule could
# only permit something that it never does.
networkPolicy:
  enabled: false
  # Selectors for whatever scrapes this exporter, for example the Prometheus
  # or Alloy pod. An empty list renders a policy that permits the metrics port
  # from anywhere and denies every other port. That limits the ports, not the
  # clients.
  ingressFrom: []
