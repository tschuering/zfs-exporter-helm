---
# The only workflow that publishes. Triggered by a tag, which is the record of
# what was released -- nothing here derives a version from a branch.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Produces, for that tag:
#   * a multi-arch image on ghcr.io, built from the pinned upstream release
#   * an SBOM, attached to the image as an attestation
#   * a cosign signature, keyless, tied to this workflow's identity
#   * the Helm chart, pushed as an OCI artifact and signed the same way
#
# Consumers can verify all of it without holding a key:
#
#   cosign verify ghcr.io/tschuering/zfs-exporter:0.1.0 \
#     --certificate-identity-regexp '^https://github.com/tschuering/zfs-exporter-helm/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Not ${{ github.repository }}: this repo is named for the chart, but
  # what people pull is an exporter. Change here and in the chart's
  # image.repository together.
  IMAGE_NAME: ${{ github.repository_owner }}/zfs-exporter

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Push to GHCR, and let cosign mint a short-lived OIDC identity instead
      # of this repo holding a signing key.
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Versioned by the packaging release, not by the exporter inside it.
          # An upstream-version tag would be ambiguous: two releases packaging
          # zfs_exporter 2.4.1 can differ in base image, ZFS userland and
          # patches, and the one number that cannot express any of that is
          # upstream's.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build provenance, so the image records how it was made.
          provenance: mode=max
          sbom: true

      # Signed by digest, not tag: a tag can be moved onto other bytes after
      # the signature is made, and then the signature no longer says anything
      # about what a consumer pulls.
      - name: sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: sbom
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: attest sbom
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "${IMAGE}@${DIGEST}"

      # Attached to the GitHub release as well as the image. The attestation is
      # for tooling; a downloadable file is for whoever wants to read it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 1

  chart:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Two logins, because the two tools do not share a credential store.
      # `helm registry login` below writes helm's own config; cosign reads
      # Docker's, and without this it cannot even pull the manifest it is
      # being asked to sign -- which surfaces as UNAUTHORIZED on a chart that
      # pushed seconds earlier.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: package and push
        id: push
        env:
          REGISTRY: ${{ env.REGISTRY }}
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "${TOKEN}" | helm registry login "${REGISTRY}" \
            --username "${ACTOR}" --password-stdin

          helm package charts/zfs-exporter --destination /tmp/chart
          package="$(ls /tmp/chart/*.tgz)"

          # helm prints "Pushed:" and "Digest:" on stdout, not stderr, so both
          # streams are captured and echoed back into the log.
          helm push "${package}" "oci://${REGISTRY}/${OWNER}/charts" > /tmp/push.log 2>&1
          cat /tmp/push.log

          digest="$(awk '/^Digest:/ { print $2 }' /tmp/push.log)"
          if [ -z "${digest}" ]; then
            echo "::error::no digest in helm push output; cosign cannot sign an empty reference"
            exit 1
          fi

          version="$(basename "${package}" .tgz | sed 's/^zfs-exporter-//')"
          echo "ref=${REGISTRY}/${OWNER}/charts/zfs-exporter@${digest}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: sign chart
        run: cosign sign --yes "${{ steps.push.outputs.ref }}"

  # Publishing to a registry leaves nothing on the repository page. This is the
  # human-facing half: what changed, and files to download without a registry
  # client.
  release:
    runs-on: ubuntu-latest
    needs: [image, chart]
    permissions:
      # The only job that writes to the repository.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # generate-notes diffs against the previous tag, which needs history.
          fetch-depth: 0

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom

      - name: package chart for download
        run: helm package charts/zfs-exporter --destination /tmp/chart

      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ needs.image.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          chart="$(ls /tmp/chart/*.tgz)"

          # Generated separately rather than with --generate-notes, so the
          # artifact table can sit above the commit list instead of after it.
          generated="$(gh api --method POST "repos/${REPO}/releases/generate-notes" \
            -f tag_name="${TAG}" --jq .body)"

          {
            echo "## Artifacts"
            echo
            echo '| | |'
            echo '| --- | --- |'
            echo "| image | \`${IMAGE}:${version}\` |"
            echo "| digest | \`${DIGEST}\` |"
            echo "| chart | \`oci://${{ env.REGISTRY }}/${OWNER}/charts/zfs-exporter\` |"
            echo
            echo "Both are signed with keyless cosign. The image carries an SPDX"
            echo "SBOM and build provenance as attestations."
            echo
            echo '```console'
            echo "\$ cosign verify ${IMAGE}:${version} \\"
            echo "    --certificate-identity-regexp '^https://github.com/${REPO}/' \\"
            echo "    --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo
            echo "${generated}"
          } > /tmp/notes.md

          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file /tmp/notes.md \
            "${chart}" \
            sbom.spdx.json
