---
# The only workflow that publishes. A tag triggers it, and that tag is the
# record of what was released. Nothing here derives a version from a branch.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# For that tag, the workflow produces:
#   * a multi-arch image on ghcr.io, built from the pinned upstream release
#   * an SBOM, attached to the image as an attestation
#   * a cosign signature, keyless, tied to this workflow's identity
#   * the Helm chart, pushed as an OCI artifact and signed in the same way
#
# A consumer can verify all of it without a key:
#
#   cosign verify ghcr.io/tschuering/zfs-exporter:0.1.0 \
#     --certificate-identity-regexp '^https://github.com/tschuering/zfs-exporter-helm/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # This is not ${{ github.repository }}. The repository is named for the
  # chart, but what a user pulls is an exporter. Change this value and the
  # chart's image.repository together.
  IMAGE_NAME: ${{ github.repository_owner }}/zfs-exporter

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # These permissions push to GHCR, and they let cosign create a
      # short-lived OIDC identity. This repository therefore holds no signing
      # key.
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      # The release version is the tag. A run from a branch carries no version
      # to publish, so it stops here. Without this guard the failure comes
      # later and reads as something else: `helm package --version` rejects a
      # branch name as invalid semver, and the image build gets an empty tag
      # list.
      - name: refuse a non-tag ref
        run: |
          case "${{ github.ref }}" in
            refs/tags/v*) ;;
            *) echo "::error::release runs on a v* tag only"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The version comes from the packaging release, not from the
          # exporter in it. A tag with the upstream version would be ambiguous.
          # Two releases that package zfs_exporter 2.4.1 can differ in base
          # image, ZFS userland and patches, and the upstream number cannot
          # express any of that.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build provenance, so the image records how it was made.
          provenance: mode=max
          sbom: true

      # cosign signs the digest, not the tag. Someone can move a tag onto
      # other bytes after the signature is made. The signature would then say
      # nothing about what a consumer pulls.
      - name: sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: sbom
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: attest sbom
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "${IMAGE}@${DIGEST}"

      # The SBOM is attached to the GitHub release and to the image. The
      # attestation is for tooling. The downloadable file is for a person who
      # wants to read it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 1

  chart:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # There are two logins, because the two tools do not share a credential
      # store. `helm registry login` below writes helm's own config. cosign
      # reads Docker's config, and without this step it cannot pull the
      # manifest that it must sign. That failure appears as UNAUTHORIZED on a
      # chart that pushed seconds earlier.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: package and push
        id: push
        env:
          REGISTRY: ${{ env.REGISTRY }}
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "${TOKEN}" | helm registry login "${REGISTRY}" \
            --username "${ACTOR}" --password-stdin

          # The version comes from the tag, not from Chart.yaml. Chart.yaml
          # holds a placeholder, so every `helm package` call in this workflow
          # passes --version. A call without it publishes the placeholder.
          helm package charts/zfs-exporter --version "${TAG#v}" \
            --destination /tmp/chart
          package="$(ls /tmp/chart/*.tgz)"

          # helm prints "Pushed:" and "Digest:" on stdout, not on stderr. This
          # step therefore captures both streams and writes them to the log.
          helm push "${package}" "oci://${REGISTRY}/${OWNER}/charts" > /tmp/push.log 2>&1
          cat /tmp/push.log

          digest="$(awk '/^Digest:/ { print $2 }' /tmp/push.log)"
          if [ -z "${digest}" ]; then
            echo "::error::no digest in helm push output; cosign cannot sign an empty reference"
            exit 1
          fi

          version="${TAG#v}"
          echo "ref=${REGISTRY}/${OWNER}/charts/zfs-exporter@${digest}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: sign chart
        run: cosign sign --yes "${{ steps.push.outputs.ref }}"

  # A push to a registry leaves nothing on the repository page. This job is
  # the part that a person reads. It shows what changed, and it attaches files
  # to download without a registry client.
  release:
    runs-on: ubuntu-latest
    needs: [image, chart]
    permissions:
      # The only job that writes to the repository.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # generate-notes compares against the previous tag, which needs history.
          fetch-depth: 0

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom

      - name: package chart for download
        env:
          TAG: ${{ github.ref_name }}
        run: |
          helm package charts/zfs-exporter --version "${TAG#v}" \
            --destination /tmp/chart

      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ needs.image.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          chart="$(ls /tmp/chart/*.tgz)"

          # The notes are generated in a separate call, and not with
          # --generate-notes, so that the artifact table can stand above the
          # commit list instead of below it.
          generated="$(gh api --method POST "repos/${REPO}/releases/generate-notes" \
            -f tag_name="${TAG}" --jq .body)"

          {
            echo "## Artifacts"
            echo
            echo '| | |'
            echo '| --- | --- |'
            echo "| image | \`${IMAGE}:${version}\` |"
            echo "| digest | \`${DIGEST}\` |"
            echo "| chart | \`oci://${{ env.REGISTRY }}/${OWNER}/charts/zfs-exporter\` |"
            echo
            echo "Both are signed with keyless cosign. The image carries an SPDX"
            echo "SBOM and build provenance as attestations."
            echo
            echo '```console'
            echo "\$ cosign verify ${IMAGE}:${version} \\"
            echo "    --certificate-identity-regexp '^https://github.com/${REPO}/' \\"
            echo "    --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo
            echo "${generated}"
          } > /tmp/notes.md

          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file /tmp/notes.md \
            "${chart}" \
            sbom.spdx.json

  # A classic HTTP Helm repository, published next to the OCI one.
  #
  # It is only a static index.yaml. The chart tarballs are the assets that the
  # release job already attached to each GitHub release. Nothing is stored
  # twice, and both publication paths describe the same bytes. The index points
  # into the releases.
  #
  #   helm repo add zfs-exporter https://tschuering.github.io/zfs-exporter-helm
  #
  # This job runs after `release`, because the URLs that it writes resolve only
  # after the release that carries them exists.
  pages:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: rebuild the index
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/idx

          # The chart is packaged again, and not downloaded from the release.
          # `helm repo index` reads the chart metadata from the tarball, so the
          # file must be present. The chart and the helm version are the same,
          # so these bytes are the same as the asset.
          helm package charts/zfs-exporter --version "${TAG#v}" \
            --destination /tmp/idx

          # Merge onto the published index, so that previous versions remain.
          # The published index is absent on the first release, which is the
          # only time the branch does not yet exist.
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth 1 origin gh-pages
            git show origin/gh-pages:index.yaml > /tmp/old-index.yaml
            helm repo index /tmp/idx \
              --url "https://github.com/${REPO}/releases/download/${TAG}" \
              --merge /tmp/old-index.yaml
          else
            helm repo index /tmp/idx \
              --url "https://github.com/${REPO}/releases/download/${TAG}"
          fi

          echo "== index.yaml =="
          cat /tmp/idx/index.yaml

      - name: publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          cp /tmp/idx/index.yaml "${out}/index.yaml"

          # Pages serves the branch root. This page gives a visitor something
          # other than a 404.
          cat > "${out}/index.html" <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <title>zfs-exporter Helm repository</title>
          <h1>zfs-exporter</h1>
          <p><code>helm repo add zfs-exporter https://tschuering.github.io/zfs-exporter-helm</code></p>
          <p>Charts are served from the <a href="https://github.com/${REPO}/releases">releases</a>.
             Source: <a href="https://github.com/${REPO}">${REPO}</a>.</p>
          HTML

          cd "${out}"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.yaml index.html
          git commit -q -m "Helm repository index for ${TAG}"

          # This is an orphan branch with one commit, force-pushed. The step
          # above generates the index and merges it with the previous published
          # copy, so the branch history holds nothing that the releases do not
          # already record.
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" gh-pages
