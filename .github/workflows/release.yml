---
# The only workflow that publishes. A tag triggers it, and that tag is the
# record of what was released. Nothing here derives a version from a branch.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# For that tag, the workflow produces:
#   * a multi-arch image on ghcr.io, built from the pinned upstream release
#   * an SBOM, attached to the image as an attestation
#   * a cosign signature, keyless, tied to this workflow's identity
#   * the Helm chart, pushed as an OCI artifact and signed in the same way
#
# A consumer can verify all of it without a key:
#
#   cosign verify ghcr.io/tschuering/zfs-exporter:0.1.0 \
#     --certificate-identity-regexp '^https://github.com/tschuering/zfs-exporter-helm/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# An explicit bash shell runs each step with -o pipefail. The default shell is
# bash without pipefail, and there a failure at the head of a pipeline does
# not stop a step.
defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io
  # This is not ${{ github.repository }}. The repository is named for the
  # chart, but what a user pulls is an exporter. Change this value and the
  # chart's image.repository together.
  IMAGE_NAME: ${{ github.repository_owner }}/zfs-exporter

jobs:
  # Each architecture builds on its own native runner, without emulation, and
  # pushes its image by digest and without a tag. The image job below joins
  # the digests into one multi-arch manifest, and the tags land on that.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      # The release version is the tag. A run from a branch carries no version
      # to publish, so it stops here. Without this guard the failure comes
      # later and reads as something else: `helm package --version` rejects a
      # branch name as invalid semver, and the image build gets an empty tag
      # list.
      # The ref goes through the environment, not through ${{ }} in the
      # script. A ref name can contain $ and parentheses, and text that the
      # runner splices into the script runs as code.
      - name: refuse a non-tag ref
        env:
          REF: ${{ github.ref }}
        run: |
          case "${REF}" in
            refs/tags/v*) ;;
            *) echo "::error::release runs on a v* tag only"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The cache scope matches the CI workflow, so a release build starts
      # from the layers that CI already built for this commit.
      - name: build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          # Build provenance, so the image records how it was made.
          provenance: mode=max
          sbom: true
          # The value is one comma-separated list, and buildx reads it as
          # CSV. A line break would put a space into a field, so the line
          # stays long.
          # yamllint disable-line rule:line-length
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      # The digest travels to the image job as the name of an empty file.
      # An output cannot do this, because a matrix writes one output for all
      # legs, and the last leg wins.
      - name: export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      # These permissions push to GHCR, and they let cosign create a
      # short-lived OIDC identity. Thus this repository holds no signing
      # key.
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The version comes from the packaging release, not from the
          # exporter in it. A tag with the upstream version is ambiguous.
          # Two releases that package zfs_exporter 2.4.1 can differ in base
          # image, ZFS userland and patches, and the upstream number cannot
          # express any of that.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # One manifest list joins the per-architecture digests, and every tag
      # from the metadata step points at it.
      - name: create the manifest list
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          refs=()
          for f in *; do
            refs+=("${IMAGE}@sha256:${f}")
          done

          tags=()
          while IFS= read -r tag; do
            tags+=(-t "${tag}")
          done < <(jq -r '.tags[]' <<< "${DOCKER_METADATA_OUTPUT_JSON}")

          docker buildx imagetools create "${tags[@]}" "${refs[@]}"

      # The digest of the manifest list, not of one architecture. The chart
      # and the release notes point at this value, and cosign signs it.
      - name: resolve the manifest digest
        id: digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          digest="$(docker buildx imagetools inspect \
            "${IMAGE}:${VERSION}" --format '{{ .Manifest.Digest }}')"
          if [ -z "${digest}" ]; then
            echo "::error::no digest for ${IMAGE}:${VERSION}"
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      # cosign signs the digest, not the tag. Someone can move a tag onto
      # other bytes after the sign step. The signature then says nothing
      # about what a consumer pulls.
      - name: sign
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: sbom
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: attest sbom
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "${IMAGE}@${DIGEST}"

      # The SBOM is attached to the GitHub release and to the image. The
      # attestation is for tooling. The downloadable file is for a person who
      # wants to read it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 1

  chart:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # There are two logins, because the two tools do not share a credential
      # store. `helm registry login` below writes helm's own config. cosign
      # reads Docker's config, and without this step it cannot pull the
      # manifest that it must sign. That failure appears as UNAUTHORIZED on a
      # chart that pushed seconds earlier.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: package and push
        id: push
        env:
          REGISTRY: ${{ env.REGISTRY }}
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "${TOKEN}" | helm registry login "${REGISTRY}" \
            --username "${ACTOR}" --password-stdin

          # The version comes from the tag, not from Chart.yaml. Chart.yaml
          # holds a placeholder, so every `helm package` call in this workflow
          # passes --version. A call without it publishes the placeholder.
          helm package charts/zfs-exporter --version "${TAG#v}" \
            --destination /tmp/chart
          packages=(/tmp/chart/*.tgz)
          if [ "${#packages[@]}" -ne 1 ] || [ ! -f "${packages[0]}" ]; then
            echo "::error::expected one chart package in /tmp/chart, got: ${packages[*]}"
            exit 1
          fi
          package="${packages[0]}"

          # helm prints "Pushed:" and "Digest:" on stdout, not on stderr. tee
          # writes both streams to the log and still shows them when the push
          # fails. A redirection into a file hides the error, because
          # set -e stops the step before a later cat.
          helm push "${package}" "oci://${REGISTRY}/${OWNER}/charts" 2>&1 \
            | tee /tmp/push.log

          digest="$(awk '/^Digest:/ { print $2 }' /tmp/push.log)"
          if [ -z "${digest}" ]; then
            echo "::error::no digest in helm push output; cosign cannot sign an empty reference"
            exit 1
          fi

          version="${TAG#v}"
          echo "ref=${REGISTRY}/${OWNER}/charts/zfs-exporter@${digest}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: sign chart
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: cosign sign --yes "${REF}"

  # A push to a registry leaves nothing on the repository page. This job is
  # the part that a person reads. It shows what changed, and it attaches files
  # to download without a registry client.
  release:
    runs-on: ubuntu-latest
    needs: [image, chart]
    permissions:
      # The only job that writes to the repository.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # generate-notes compares against the previous tag, which needs history.
          fetch-depth: 0

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom

      - name: package chart for download
        env:
          TAG: ${{ github.ref_name }}
        run: |
          helm package charts/zfs-exporter --version "${TAG#v}" \
            --destination /tmp/chart

      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ needs.image.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          charts=(/tmp/chart/*.tgz)
          if [ "${#charts[@]}" -ne 1 ] || [ ! -f "${charts[0]}" ]; then
            echo "::error::expected one chart package in /tmp/chart, got: ${charts[*]}"
            exit 1
          fi
          chart="${charts[0]}"

          # The notes are generated in a separate call, and not with
          # --generate-notes, so that the artifact table can stand above the
          # commit list instead of below it.
          generated="$(gh api --method POST "repos/${REPO}/releases/generate-notes" \
            -f tag_name="${TAG}" --jq .body)"

          {
            echo "## Artifacts"
            echo
            echo '| | |'
            echo '| --- | --- |'
            echo "| image | \`${IMAGE}:${version}\` |"
            echo "| digest | \`${DIGEST}\` |"
            echo "| chart | \`oci://${REGISTRY}/${OWNER}/charts/zfs-exporter\` |"
            echo
            echo "Both are signed with keyless cosign. The image carries an SPDX"
            echo "SBOM and build provenance as attestations."
            echo
            echo '```console'
            echo "\$ cosign verify ${IMAGE}:${version} \\"
            echo "    --certificate-identity-regexp '^https://github.com/${REPO}/' \\"
            echo "    --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo
            echo "${generated}"
          } > /tmp/notes.md

          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file /tmp/notes.md \
            "${chart}" \
            sbom.spdx.json

  # A classic HTTP Helm repository, published next to the OCI one.
  #
  # It is only a static index.yaml. The chart tarballs are the assets that the
  # release job already attached to each GitHub release. Nothing is stored
  # twice, and both publication paths describe the same bytes. The index points
  # into the releases.
  #
  #   helm repo add zfs-exporter https://tschuering.github.io/zfs-exporter-helm
  #
  # This job runs after `release`, because the URLs that it writes resolve only
  # after the release that carries them exists.
  pages:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: rebuild the index
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/idx

          # The chart is packaged again, and not downloaded from the release.
          # `helm repo index` reads the chart metadata from the tarball, so the
          # file must be present. The chart and the helm version are the same,
          # so these bytes are the same as the asset.
          helm package charts/zfs-exporter --version "${TAG#v}" \
            --destination /tmp/idx

          # Merge onto the published index, so that previous versions remain.
          # The published index is absent on the first release, which is the
          # only time the branch does not yet exist.
          #
          # The exit code decides which case this is. ls-remote exits with 2
          # when the branch is absent, and with another nonzero code on a
          # network or auth failure. That failure must stop the job. If that
          # failure takes the first-release path, the force-push at the end
          # replaces the published index with one that lists only this
          # release.
          rc=0
          git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1 || rc=$?
          case "${rc}" in
            0)
              git fetch --depth 1 origin gh-pages
              git show origin/gh-pages:index.yaml > /tmp/old-index.yaml
              helm repo index /tmp/idx \
                --url "https://github.com/${REPO}/releases/download/${TAG}" \
                --merge /tmp/old-index.yaml
              ;;
            2)
              helm repo index /tmp/idx \
                --url "https://github.com/${REPO}/releases/download/${TAG}"
              ;;
            *)
              echo "::error::git ls-remote failed with status ${rc}"
              exit 1
              ;;
          esac

          echo "== index.yaml =="
          cat /tmp/idx/index.yaml

      - name: publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          cp /tmp/idx/index.yaml "${out}/index.yaml"

          # Pages serves the branch root. This page gives a visitor something
          # other than a 404.
          cat > "${out}/index.html" <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <title>zfs-exporter Helm repository</title>
          <h1>zfs-exporter</h1>
          <p><code>helm repo add zfs-exporter https://tschuering.github.io/zfs-exporter-helm</code></p>
          <p>Charts are served from the <a href="https://github.com/${REPO}/releases">releases</a>.
             Source: <a href="https://github.com/${REPO}">${REPO}</a>.</p>
          HTML

          cd "${out}"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.yaml index.html
          git commit -q -m "Helm repository index for ${TAG}"

          # This is an orphan branch with one commit, force-pushed. The step
          # above generates the index and merges it with the previous published
          # copy, so the branch history holds nothing that the releases do not
          # already record.
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" gh-pages
