---
# Every check that must pass before a change lands. Nothing here publishes.
# release.yml is the only workflow that pushes anything.
#
# Each action is pinned to a commit SHA, not to a tag. A tag can move, and a
# compromised action runs with this workflow's token. Renovate moves the
# comments and the SHAs together.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. A job that needs more permission declares it.
permissions:
  contents: read

# An explicit bash shell runs each step with -o pipefail. The default shell is
# bash without pipefail, and there a failure at the head of a pipeline does
# not stop a step.
defaults:
  run:
    shell: bash

env:
  # The OpenZFS branches that the image carries a userland for. Keep these in
  # step with the builder stages in the Dockerfile.
  ZFS_TREES: "2.3 2.4"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: shellcheck
        run: shellcheck hack/*.sh

      # actionlint checks the workflow files, and it runs shellcheck on each
      # run block. The step above covers the hack/ scripts, and this step
      # covers the inline shell. The Go module proxy verifies the pinned
      # version against the public checksum database.
      - name: actionlint
        run: |
          # renovate: datasource=github-releases depName=rhysd/actionlint
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

      # The version is pinned, so a new yamllint release cannot turn CI red
      # without a diff. Renovate moves it.
      - name: yamllint
        run: |
          # renovate: datasource=pypi depName=yamllint
          pipx install yamllint==1.38.0
          yamllint --strict .

  shim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Almost everything here is the standard toolchain. The one third-party
      # linter is golangci-lint, in its own step. .golangci.yml selects
      # its linters and gives the reason for each exception.

      # -s in addition to the default. It reports constructs that the language
      # has a shorter form for. That is the half of gofmt that changes how the
      # code reads, and not only where the spaces go.
      #
      # go list gives gofmt the package directories, and not ".". gofmt walks
      # a directory tree literally. Thus "." also reads the Go files that the
      # vendored agent skills carry under .agents/. The go tool skips
      # dot-directories, so this list stays correct when a package comes or
      # goes.
      #
      # xargs -r starts nothing when the list is empty, and pipefail makes a
      # go list failure stop the step. Without both, gofmt reads stdin, finds
      # nothing, and the step passes with no check done.
      - name: gofmt
        run: |
          unformatted="$(go list -f '{{.Dir}}' ./... | xargs -r gofmt -s -l)"
          if [ -n "${unformatted}" ]; then
            echo "::error::gofmt -s needed: ${unformatted}"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      # golangci-lint carries the staticcheck analyzers and gosec, so this one
      # step covers general static analysis and security static analysis.
      # govulncheck below stays separate, because it scans dependencies and
      # not this code. The action is pinned to a commit SHA like the other
      # actions. The tool version is pinned through the input below, so a new
      # golangci-lint release cannot turn CI red without a diff. Renovate
      # moves both pins.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          version: v2.13.2

      # go.mod and go.sum drift silently. A dependency that is added and later
      # removed leaves entries behind, and no other step of the build reports
      # them. -diff shows the difference and rewrites nothing, so CI fails
      # instead of making a silent correction.
      - name: modules are tidy
        run: go mod tidy -diff

      # This compares the module cache with the hashes in go.sum. Thus it
      # catches a dependency whose content changed under an unchanged version.
      - name: modules verify
        run: go mod verify

      # -race, because the plugin is concurrent. A gRPC server, the
      # ListAndWatch stream, the supervisor loop and a ticker all run at the
      # same time, and the tests exercise the stream.
      #
      # -shuffle=on randomizes the test order, so a dependence between tests
      # fails here and not on some later unrelated change. The coverage
      # profile falls out of the same run, so the floor check below costs no
      # extra test time.
      - name: test
        run: go test -race -shuffle=on -coverprofile=cover.out ./...

      # The floor guards the level that the unit tests reached. It is a
      # regression guard, and not a target to chase: a drop below the floor
      # means that tests went missing. The comparison runs in awk, because
      # the shell cannot compare decimal numbers. An empty total also fails
      # the comparison, so a parse problem cannot pass silently.
      - name: coverage floor
        run: |
          floor="75.0"
          total="$(go tool cover -func=cover.out | awk '/^total:/ { sub(/%/, "", $3); print $3 }')"
          echo "statement coverage: ${total}% (floor: ${floor}%)"
          if ! awk -v total="${total}" -v floor="${floor}" 'BEGIN { exit !(total >= floor) }'; then
            echo "::error::statement coverage ${total}% is below the floor of ${floor}%"
            exit 1
          fi

      # This checks reachability, not presence. trivy lists every advisory in
      # the module graph. govulncheck reports only the advisories that reach a
      # function this code calls, and it prints the call path. Thus a finding
      # here is something to act on, and not something to triage. That is
      # why this step blocks.
      #
      # The version is pinned through the tool directive in go.mod, so a
      # reviewer sees it in a diff and renovate can move it.
      - name: govulncheck
        run: go tool govulncheck ./...

      - name: build
        run: CGO_ENABLED=0 go build ./...

      # The image job builds both architectures, and it does so under
      # emulation. A compile for arm64 here fails in seconds instead of
      # minutes.
      - name: cross-compile
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          for arch in amd64 arm64; do
            echo "== ${arch}"
            GOARCH="${arch}" go build ./...
          done

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: helm lint
        run: helm lint charts/zfs-exporter --strict

      # A render with the defaults covers only the objects that a default
      # install creates. ci/full-values.yaml enables every optional object, so
      # this step also covers the ServiceMonitor and NetworkPolicy templates.
      - name: render and schema-check
        run: |
          set -euo pipefail

          # The digest pins the exact bytes. A release asset can be replaced
          # under an unchanged tag, so a version pin alone is not enough.
          # Move the version and the digest together.
          # renovate: datasource=github-releases depName=yannh/kubeconform
          kubeconform_version=v0.7.0
          kubeconform_sha256=c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
          curl -fsSL --retry 3 --retry-all-errors -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${kubeconform_version}/kubeconform-linux-amd64.tar.gz"
          echo "${kubeconform_sha256}  /tmp/kubeconform.tar.gz" | sha256sum -c
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform

          # CRD schemas for the kinds that the chart renders and that core
          # Kubernetes does not define
          crds='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main'
          crds="${crds}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"

          for values in charts/zfs-exporter/ci/*.yaml; do
            echo "::group::${values}"
            helm template ci charts/zfs-exporter \
              --namespace monitoring \
              --values "${values}" > "/tmp/$(basename "${values}").rendered"
            kubeconform -strict -summary \
              -schema-location default \
              -schema-location "${crds}" \
              "/tmp/$(basename "${values}").rendered"
            echo "::endgroup::"
          done

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Both permissions are for the SARIF upload below. actions:read lets the
      # uploader read the workflow run that it reports against. GitHub
      # documents that permission as required for a workflow in a private
      # repository. Without it, the upload fails on
      # GET /repos/{o}/{r}/actions/runs/{id} with "Resource not accessible by
      # integration".
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # This builds for the host architecture and loads the image locally, so
      # that the smoke test runs natively. The exporter forks zpool(8), and a
      # fork under QEMU user-mode emulation segfaults for reasons unrelated to
      # this image.
      - name: build (amd64, loaded)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: zfs-exporter:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # This proves what the Dockerfile is responsible for. The exporter runs.
      # The shim selects a bundled userland and starts it through that tree's
      # own loader. /metrics answers.
      #
      # No runner has a ZFS kernel module, so this step cannot read a real
      # pool. ZFS_USERLAND_VERSION replaces /sys/module/zfs/version, which is
      # what lets this step exercise both trees. The message "modules cannot be
      # auto-loaded" means that the zpool of that tree, and every library it
      # needs, are present and executable. That is the part this image owns.
      - name: smoke test
        run: |
          set -euo pipefail

          docker run --rm zfs-exporter:ci --version

          read -ra trees <<< "${ZFS_TREES}"
          for tree in "${trees[@]}"; do
            for bin in zpool zfs; do
              out="$(docker run --rm --entrypoint "${bin}" \
                       -e "ZFS_USERLAND_VERSION=${tree}" \
                       zfs-exporter:ci version 2>&1 || true)"
              case "${out}" in
                *"cannot be auto-loaded"*|*"ZFS Module"*|zfs-${tree}*)
                  echo "ok: ${tree} ${bin} runs and links" ;;
                *"no bundled OpenZFS userland"*)
                  echo "::error::${tree} is not in the image: ${out}"; exit 1 ;;
                *"error while loading shared libraries"*|*"No such file"*)
                  echo "::error::${tree} ${bin} is unlinked: ${out}"; exit 1 ;;
                *)
                  echo "::error::unexpected from ${tree} ${bin}: ${out}"; exit 1 ;;
              esac
            done
          done

          # For a host branch that the image does not carry, the shim must
          # say so clearly. It must not fail at a later point.
          out="$(docker run --rm --entrypoint zpool \
                   -e ZFS_USERLAND_VERSION=9.9 zfs-exporter:ci version 2>&1 || true)"
          case "${out}" in
            *"no bundled OpenZFS userland for host version 9.9"*)
              echo "ok: unsupported host branch reports legibly" ;;
            *)
              echo "::error::unhelpful message for an unsupported branch: ${out}"
              exit 1 ;;
          esac

          docker run -d --name smoke -p 9134:9134 zfs-exporter:ci
          up=""
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:9134/metrics -o /tmp/metrics; then up=1; break; fi
            sleep 1
          done
          # The logs are printed before the container goes away. Without them
          # this failure reads as a missing /tmp/metrics, which points at the
          # wrong place.
          if [ -z "${up}" ]; then
            echo "::error::/metrics gave no answer in 30 seconds"
            docker logs smoke
            docker rm -f smoke >/dev/null
            exit 1
          fi
          docker rm -f smoke >/dev/null

          grep -q '^zfs_exporter_build_info' /tmp/metrics
          grep -q '^zfs_scrape_collector_success' /tmp/metrics
          echo "ok: /metrics served $(wc -l < /tmp/metrics) lines"

      - name: build (arm64, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha

      # The scan is split deliberately.
      #
      # The OS layer belongs to this repository. The base image digest and the
      # two packages installed above it decide its content, so this repository
      # can fix a HIGH finding there. Thus that scan blocks.
      #
      # The exporter binary does not belong to this repository. Upstream
      # publishes prebuilt release binaries, and this image packages exactly
      # those bytes. That provenance is the point, and a rebuild from source to
      # clear findings discards it. Upstream currently builds with an
      # older Go toolchain, so the binary carries stdlib and x/* advisories
      # that no change here can correct. This workflow reports those findings
      # to the Security tab and records them as accepted risk (see
      # SECURITY.md). It does not keep the pipeline permanently red.
      - name: trivy (os packages, blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: zfs-exporter:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os
          severity: HIGH,CRITICAL

      - name: trivy (everything, reported)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: zfs-exporter:ci
          format: sarif
          output: trivy.sarif
          exit-code: "0"
          ignore-unfixed: true
          severity: MEDIUM,HIGH,CRITICAL

      # A public repository ingests SARIF into code scanning at no cost. A
      # private repository needs GitHub Advanced Security. Without that, the
      # upload fails instead of skipping, and every run turns red for a reason
      # unrelated to the code. Thus this step does not run while the
      # repository is private. It starts to work when the repository
      # becomes public.
      #
      # The scan above runs in both cases, so nothing goes unexamined. The
      # findings appear in the job log instead of the Security tab.
      - name: upload to the security tab
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/upload-sarif@486fec2a3ea2626afcd8c7e9208b4f515078dd7e # codeql-bundle-v2.26.4
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: report findings in the log instead
        if: ${{ github.event.repository.private }}
        run: |
          echo "Repository is private, so SARIF was not uploaded to code scanning."
          echo "Findings from the scan above:"
          python3 - <<'EOF'
          import json
          with open("trivy.sarif") as fh:
              sarif = json.load(fh)
          rules = {
              r["id"]: r.get("shortDescription", {}).get("text", "")
              for run in sarif.get("runs", [])
              for r in run.get("tool", {}).get("driver", {}).get("rules", [])
          }
          results = [r for run in sarif.get("runs", []) for r in run.get("results", [])]
          print(f"  {len(results)} result(s)")
          for r in results[:40]:
              print(f"  {r.get('ruleId')}: {rules.get(r.get('ruleId'), '')[:90]}")
          EOF
