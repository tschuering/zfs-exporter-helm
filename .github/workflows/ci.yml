---
# Everything that has to hold before a change lands. Nothing here publishes;
# release.yml is the only workflow that pushes anything.
#
# Actions are pinned to commit SHAs rather than tags: a tag is mutable and a
# compromised action runs with this workflow's token. Renovate keeps the
# comments and the SHAs moving together.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs that need more say so themselves.
permissions:
  contents: read

env:
  # OpenZFS branches the image bundles a userland for. Keep in step with the
  # builder stages in the Dockerfile.
  ZFS_TREES: "2.3 2.4"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: shellcheck
        run: shellcheck hack/*.sh

      - name: yamllint
        run: |
          pipx install yamllint
          yamllint --strict .

  shim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l ./cmd)"
          if [ -n "${unformatted}" ]; then
            echo "::error::gofmt needed: ${unformatted}"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: build
        run: CGO_ENABLED=0 go build ./...

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: helm lint
        run: helm lint charts/zfs-exporter --strict

      # Rendering with the defaults only exercises the objects a default
      # install creates. ci/full-values.yaml turns on everything optional, so
      # the ServiceMonitor and NetworkPolicy templates are covered too.
      - name: render and schema-check
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

          # CRD schemas for kinds the chart renders that are not core k8s
          crds='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main'
          crds="${crds}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"

          for values in charts/zfs-exporter/ci/*.yaml; do
            echo "::group::${values}"
            helm template ci charts/zfs-exporter \
              --namespace monitoring \
              --values "${values}" > "/tmp/$(basename "${values}").rendered"
            kubeconform -strict -summary \
              -schema-location default \
              -schema-location "${crds}" \
              "/tmp/$(basename "${values}").rendered"
            echo "::endgroup::"
          done

      # The chart version has to move whenever the chart does, or a consumer
      # pinning a version silently gets different templates.
      - name: chart version bumped
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "${{ github.base_ref }}"
          if git diff --quiet "origin/${{ github.base_ref }}" -- charts/; then
            echo "chart untouched, nothing to check"
            exit 0
          fi
          chart=charts/zfs-exporter/Chart.yaml
          base="origin/${{ github.base_ref }}"
          before="$(git show "${base}:${chart}" | awk '/^version:/ { print $2 }')"
          after="$(awk '/^version:/ { print $2 }' "${chart}")"
          if [ "${before}" = "${after}" ]; then
            echo "::error::charts/ changed but Chart.yaml version is ${after}"
            exit 1
          fi
          echo "chart version ${before} -> ${after}"

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Both are for the SARIF upload below. actions:read is what lets the
      # uploader read the workflow run it is reporting against, and GitHub
      # documents it as required for workflows in private repositories --
      # without it the upload fails on GET /repos/{o}/{r}/actions/runs/{id}
      # with "Resource not accessible by integration".
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Built for the host arch and loaded locally so the smoke test runs
      # natively -- the exporter forks zpool(8), and forking under QEMU
      # user-mode emulation segfaults for reasons that have nothing to do
      # with this image.
      - name: build (amd64, loaded)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: zfs-exporter:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves what the Dockerfile is actually responsible for: the exporter
      # runs, the shim picks a bundled userland and starts it through that
      # tree's own loader, and /metrics serves.
      #
      # No runner has a ZFS kernel module, so a real pool cannot be read here.
      # ZFS_USERLAND_VERSION stands in for /sys/module/zfs/version, which is
      # what lets both trees be exercised: reaching "modules cannot be
      # auto-loaded" means that tree's zpool and every library it needs are
      # present and executable, which is the part this image owns.
      - name: smoke test
        run: |
          set -euo pipefail

          docker run --rm zfs-exporter:ci --version

          for tree in ${ZFS_TREES}; do
            for bin in zpool zfs; do
              out="$(docker run --rm --entrypoint "${bin}" \
                       -e "ZFS_USERLAND_VERSION=${tree}" \
                       zfs-exporter:ci version 2>&1 || true)"
              case "${out}" in
                *"cannot be auto-loaded"*|*"ZFS Module"*|zfs-${tree}*)
                  echo "ok: ${tree} ${bin} runs and links" ;;
                *"no bundled OpenZFS userland"*)
                  echo "::error::${tree} is not in the image: ${out}"; exit 1 ;;
                *"error while loading shared libraries"*|*"No such file"*)
                  echo "::error::${tree} ${bin} is unlinked: ${out}"; exit 1 ;;
                *)
                  echo "::error::unexpected from ${tree} ${bin}: ${out}"; exit 1 ;;
              esac
            done
          done

          # A host branch the image does not carry has to say so plainly
          # rather than fail somewhere further in.
          out="$(docker run --rm --entrypoint zpool \
                   -e ZFS_USERLAND_VERSION=9.9 zfs-exporter:ci version 2>&1 || true)"
          case "${out}" in
            *"no bundled OpenZFS userland for host version 9.9"*)
              echo "ok: unsupported host branch reports legibly" ;;
            *)
              echo "::error::unhelpful message for an unsupported branch: ${out}"
              exit 1 ;;
          esac

          docker run -d --name smoke -p 9134:9134 zfs-exporter:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9134/metrics -o /tmp/metrics; then break; fi
            sleep 1
          done
          docker rm -f smoke >/dev/null

          grep -q '^zfs_exporter_build_info' /tmp/metrics
          grep -q '^zfs_scrape_collector_success' /tmp/metrics
          echo "ok: /metrics served $(wc -l < /tmp/metrics) lines"

      - name: build (arm64, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha

      # Split deliberately.
      #
      # The OS layer is ours: what goes into it is decided by the base image
      # digest and the two packages installed on top, so a HIGH there is a
      # thing this repository can fix, and it blocks.
      #
      # The exporter binary is not ours. Upstream ships prebuilt release
      # binaries and this image is a packaging of exactly those bytes -- that
      # provenance is the point, and rebuilding from source to clear findings
      # would throw it away. Upstream currently builds with an older Go
      # toolchain, so the binary carries stdlib and x/* advisories that no
      # change here can address. Those are reported to the Security tab and
      # tracked as accepted risk (see SECURITY.md) rather than turning the
      # pipeline permanently red.
      - name: trivy (os packages, blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: zfs-exporter:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os
          severity: HIGH,CRITICAL

      - name: trivy (everything, reported)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: zfs-exporter:ci
          format: sarif
          output: trivy.sarif
          exit-code: "0"
          ignore-unfixed: true
          severity: MEDIUM,HIGH,CRITICAL

      # Public repositories ingest SARIF into code scanning for free. Private
      # ones need GitHub Advanced Security, and without it the upload fails
      # outright rather than being skipped -- so it would turn every run red
      # for a reason that has nothing to do with the code. Skipped while
      # private; starts working by itself once the repository is public.
      #
      # The scan above still runs either way, so nothing goes unexamined; the
      # findings just live in the job log rather than the Security tab.
      - name: upload to the security tab
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/upload-sarif@486fec2a3ea2626afcd8c7e9208b4f515078dd7e # codeql-bundle-v2.26.4
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: report findings in the log instead
        if: ${{ github.event.repository.private }}
        run: |
          echo "Repository is private, so SARIF was not uploaded to code scanning."
          echo "Findings from the scan above:"
          python3 - <<'EOF'
          import json
          with open("trivy.sarif") as fh:
              sarif = json.load(fh)
          rules = {
              r["id"]: r.get("shortDescription", {}).get("text", "")
              for run in sarif.get("runs", [])
              for r in run.get("tool", {}).get("driver", {}).get("rules", [])
          }
          results = [r for run in sarif.get("runs", []) for r in run.get("results", [])]
          print(f"  {len(results)} result(s)")
          for r in results[:40]:
              print(f"  {r.get('ruleId')}: {rules.get(r.get('ruleId'), '')[:90]}")
          EOF
